name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      # The inspection engine only runs inside a real browser, so the tests need one.
      - run: npx playwright install --with-deps chromium

      - name: Syntax check every entry point
        run: |
          node --check src/cli.mjs
          node --check src/server.mjs
          node --check src/mcp.mjs

      - name: Tests
        run: npm test

      # Catches the drift that shipped once: a version published without the
      # committed fixes, or files silently dropped from the package.
      - name: Package contents
        run: |
          npm pack --dry-run
          node -e "
            const p = require('./package.json'), s = require('./server.json');
            const fail = (m) => { console.error('✖ ' + m); process.exit(1); };
            if (p.version !== s.version) fail(\`package.json (\${p.version}) and server.json (\${s.version}) disagree\`);
            if (p.version !== s.packages[0].version) fail('server.json packages[].version is out of sync');
            if (p.mcpName !== s.name) fail('mcpName must equal the registry server name');
            console.log('✔ version + registry manifest in sync at ' + p.version);
          "

      - name: CLI smoke (offline, no network target)
        run: node src/cli.mjs --help | grep -q "uisight <url>"
